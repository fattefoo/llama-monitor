[project]
name = "llama-monitor"
version = "0.1.0"
description = "llama-server process monitor with health checking and systemd integration"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28,<1",
]

[project.scripts]
llama-monitor = "llama_monitor.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
